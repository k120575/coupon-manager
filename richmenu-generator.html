<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>Rich Menu Generator v4 — 暖色卡片</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            font-family: sans-serif;
            color: #eee;
        }
        canvas {
            border: 1px solid #333;
            max-width: 95vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 12px 32px;
            font-size: 16px;
            background: #0e8a7a;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #0a6e62; }
        p { color: #888; margin-top: 12px; font-size: 13px; }
    </style>
</head>

<body>
    <h2>LINE Rich Menu (2500×1686) · v4 暖色卡片</h2>
    <canvas id="c" width="2500" height="1686"></canvas>
    <div class="controls">
        <button onclick="download('png')">⬇️ 下載 PNG</button>
        <button onclick="download('jpg')">⬇️ 下載 JPG</button>
    </div>
    <p>下載後：<code style="color:#aaa">npm run richmenu -- richmenu-2500x1686.png</code></p>

    <script>
        const W = 2500, H = 1686;
        const COLS = 3, ROWS = 2;
        const cellW = W / COLS;
        const cellH = H / ROWS;
        const GAP = 30;
        const CARD_RAD = 52;
        const BADGE_RAD = 72;

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // === Warm gradient background ===
        const bg = ctx.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#FFF1E6');
        bg.addColorStop(0.5, '#FFE5D3');
        bg.addColorStop(1, '#FDDBC7');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Subtle warm dots
        ctx.fillStyle = 'rgba(255, 170, 120, 0.08)';
        for (let i = 0; i < 40; i++) {
            const x = Math.random() * W;
            const y = Math.random() * H;
            const r = Math.random() * 30 + 10;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // === White icons (drawn on colored badge) ===
        const drawIcons = [
            // 1. 查詢票券 - document + magnifier
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
                ctx.lineWidth = s * 0.05; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                // document
                const dw = s * 0.5, dh = s * 0.62;
                const dx = cx - s * 0.1, dy = cy - s * 0.05;
                roundRect(ctx, dx - dw / 2, dy - dh / 2, dw, dh, s * 0.06); ctx.stroke();
                // lines inside
                for (let i = 0; i < 3; i++) {
                    const ly = dy - s * 0.15 + i * s * 0.14;
                    ctx.beginPath();
                    ctx.moveTo(dx - dw / 2 + s * 0.08, ly);
                    ctx.lineTo(dx + dw / 2 - s * 0.08, ly);
                    ctx.stroke();
                }
                // magnifier
                const mx = cx + s * 0.26, my = cy + s * 0.24;
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath(); ctx.arc(mx, my, s * 0.16, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = s * 0.055;
                ctx.beginPath(); ctx.arc(mx, my, s * 0.14, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx + s * 0.1, my + s * 0.1);
                ctx.lineTo(mx + s * 0.22, my + s * 0.22);
                ctx.stroke();
                ctx.restore();
            },

            // 2. 分類查詢 - stacked tags
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.fillStyle = '#fff';
                // tag 1 (back)
                ctx.globalAlpha = 0.5;
                drawTag(ctx, cx - s * 0.08, cy - s * 0.18, s * 0.55);
                // tag 2 (front)
                ctx.globalAlpha = 1;
                drawTag(ctx, cx + s * 0.05, cy + s * 0.02, s * 0.62);
                ctx.restore();

                function drawTag(ctx, cx, cy, size) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(-0.2);
                    ctx.beginPath();
                    ctx.moveTo(-size * 0.15, -size * 0.5);
                    ctx.lineTo(size * 0.35, -size * 0.5);
                    ctx.lineTo(size * 0.5, -size * 0.2);
                    ctx.lineTo(size * 0.05, size * 0.45);
                    ctx.lineTo(-size * 0.5, -size * 0.1);
                    ctx.closePath();
                    ctx.fill();
                    // hole
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.arc(size * 0.2, -size * 0.28, size * 0.08, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            },

            // 3. 記錄優惠券 - plus with circle outline
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
                // circle
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.38, 0, Math.PI * 2); ctx.stroke();
                // plus
                ctx.lineWidth = s * 0.1;
                ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.2); ctx.lineTo(cx, cy + s * 0.2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - s * 0.2, cy); ctx.lineTo(cx + s * 0.2, cy); ctx.stroke();
                ctx.restore();
            },

            // 4. 使用票券 - checkmark in circle
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.08; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                // circle
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.4, 0, Math.PI * 2); ctx.stroke();
                // check
                ctx.lineWidth = s * 0.12;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.18, cy + s * 0.02);
                ctx.lineTo(cx - s * 0.03, cy + s * 0.18);
                ctx.lineTo(cx + s * 0.22, cy - s * 0.15);
                ctx.stroke();
                ctx.restore();
            },

            // 5. 刪除票券 - trash
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
                ctx.lineWidth = s * 0.06; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                // handle
                ctx.lineWidth = s * 0.05;
                ctx.strokeRect(cx - s * 0.12, cy - s * 0.38, s * 0.24, s * 0.08);
                // lid
                ctx.lineWidth = s * 0.08;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.35, cy - s * 0.25);
                ctx.lineTo(cx + s * 0.35, cy - s * 0.25);
                ctx.stroke();
                // body
                ctx.lineWidth = s * 0.07;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.25, cy - s * 0.2);
                ctx.lineTo(cx - s * 0.2, cy + s * 0.38);
                ctx.lineTo(cx + s * 0.2, cy + s * 0.38);
                ctx.lineTo(cx + s * 0.25, cy - s * 0.2);
                ctx.stroke();
                // internal lines
                ctx.lineWidth = s * 0.05;
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(cx + i * s * 0.1, cy - s * 0.12);
                    ctx.lineTo(cx + i * s * 0.1, cy + s * 0.28);
                    ctx.stroke();
                }
                ctx.restore();
            },

            // 6. 使用說明 - question in circle
            (ctx, cx, cy, s) => {
                ctx.save();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.08;
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.4, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.font = `900 ${s * 0.55}px "Microsoft JhengHei", "Helvetica Neue", sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('?', cx, cy + s * 0.02);
                ctx.restore();
            },
        ];

        const labels = ['查詢票券', '分類查詢', '記錄優惠券', '使用票券', '刪除票券', '使用說明'];

        // Per-cell accent colors (badge gradient from → to)
        const palette = [
            { from: '#34D399', to: '#059669' }, // teal
            { from: '#C084FC', to: '#7C3AED' }, // violet
            { from: '#60A5FA', to: '#2563EB' }, // blue
            { from: '#4ADE80', to: '#16A34A' }, // green
            { from: '#FB7185', to: '#DC2626' }, // rose-red
            { from: '#FBBF24', to: '#EA580C' }, // amber-orange
        ];

        // === Draw cards ===
        for (let i = 0; i < 6; i++) {
            const col = i % COLS, row = Math.floor(i / COLS);
            const x = col * cellW + GAP;
            const y = row * cellH + GAP;
            const w = cellW - GAP * 2;
            const h = cellH - GAP * 2;

            // Shadow
            ctx.save();
            ctx.shadowColor = 'rgba(80, 50, 30, 0.18)';
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 12;
            roundRect(ctx, x, y, w, h, CARD_RAD);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();

            // Subtle inner top highlight
            ctx.save();
            roundRect(ctx, x, y, w, h, CARD_RAD);
            ctx.clip();
            const hl = ctx.createLinearGradient(x, y, x, y + h * 0.3);
            hl.addColorStop(0, 'rgba(255, 240, 225, 0.6)');
            hl.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = hl;
            ctx.fillRect(x, y, w, h * 0.3);
            ctx.restore();

            // Badge (rounded square with gradient)
            const badgeSize = Math.min(w, h) * 0.48;
            const badgeCx = x + w / 2;
            const badgeCy = y + h * 0.38;
            const bgGrad = ctx.createLinearGradient(
                badgeCx - badgeSize / 2, badgeCy - badgeSize / 2,
                badgeCx + badgeSize / 2, badgeCy + badgeSize / 2,
            );
            bgGrad.addColorStop(0, palette[i].from);
            bgGrad.addColorStop(1, palette[i].to);

            ctx.save();
            ctx.shadowColor = palette[i].to + '55';
            ctx.shadowBlur = 28;
            ctx.shadowOffsetY = 10;
            roundRect(ctx, badgeCx - badgeSize / 2, badgeCy - badgeSize / 2, badgeSize, badgeSize, BADGE_RAD);
            ctx.fillStyle = bgGrad;
            ctx.fill();
            ctx.restore();

            // Icon inside badge
            drawIcons[i](ctx, badgeCx, badgeCy, badgeSize);

            // Label
            ctx.font = `700 118px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#1F2937';
            ctx.fillText(labels[i], x + w / 2, y + h * 0.82);
        }

        function download(format) {
            const link = document.createElement('a');
            if (format === 'jpg') {
                link.download = 'richmenu-2500x1686.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
            } else {
                link.download = 'richmenu-2500x1686.png';
                link.href = canvas.toDataURL('image/png');
            }
            link.click();
        }
    </script>
</body>

</html>
