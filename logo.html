<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>券管家 Coupy Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }

        .logo-container {
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(78, 205, 196, 0.3);
        }

        /* 背景裝飾 - 票券圖案 */
        .logo-container::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background:
                radial-gradient(circle at 20% 30%, rgba(78, 205, 196, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 107, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 217, 61, 0.05) 0%, transparent 60%);
        }

        /* 票券 icon */
        .ticket-icon {
            position: relative;
            width: 160px;
            height: 100px;
            margin-bottom: 16px;
        }

        .ticket {
            position: absolute;
            width: 140px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ticket-back {
            top: 0;
            left: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            transform: rotate(8deg);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .ticket-front {
            top: 10px;
            left: 0;
            background: linear-gradient(135deg, #4ecdc4, #44bd9e);
            transform: rotate(-3deg);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        /* 票券鋸齒邊 */
        .ticket::before,
        .ticket::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #302b63;
        }

        .ticket-front::before {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .ticket-front::after {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .ticket-back::before {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .ticket-back::after {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* 票券虛線 */
        .ticket-front .dashed {
            position: absolute;
            right: 36px;
            top: 10px;
            height: 60px;
            border-left: 2px dashed rgba(255, 255, 255, 0.4);
        }

        /* 票券上的勾勾 */
        .checkmark {
            font-size: 36px;
            color: white;
            font-weight: bold;
            margin-left: -10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 中文名稱 */
        .title-cn {
            font-size: 52px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 8px;
            text-shadow: 0 2px 10px rgba(78, 205, 196, 0.5);
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }

        /* 英文名稱 */
        .title-en {
            font-size: 28px;
            font-weight: 700;
            color: #4ecdc4;
            letter-spacing: 6px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            margin-top: 2px;
        }

        /* 底部裝飾線 */
        .accent-line {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4ecdc4, #ff6b6b, transparent);
            border-radius: 2px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        /* 浮動小裝飾 */
        .float-dot {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
        }

        .dot1 {
            width: 60px;
            height: 60px;
            background: #4ecdc4;
            top: 40px;
            right: 60px;
        }

        .dot2 {
            width: 40px;
            height: 40px;
            background: #ff6b6b;
            bottom: 70px;
            left: 50px;
        }

        .dot3 {
            width: 25px;
            height: 25px;
            background: #ffd93d;
            top: 100px;
            left: 80px;
        }

        .dot4 {
            width: 35px;
            height: 35px;
            background: #4ecdc4;
            bottom: 100px;
            right: 80px;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <div class="float-dot dot1"></div>
        <div class="float-dot dot2"></div>
        <div class="float-dot dot3"></div>
        <div class="float-dot dot4"></div>

        <div class="ticket-icon">
            <div class="ticket ticket-back"></div>
            <div class="ticket ticket-front">
                <div class="dashed"></div>
                <span class="checkmark">✓</span>
            </div>
        </div>

        <div class="title-cn">券管家</div>
        <div class="title-en">Coupy</div>
        <div class="accent-line"></div>
    </div>
</body>

</html>
