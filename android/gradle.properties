# org.sqlite.tmpdir：Room 編譯期 schema 驗證要載入 sqlite-jdbc 的原生 DLL，
# Windows 會擋 %TEMP% 內的 DLL 載入（存取被拒），改解到 ~/.gradle 下
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Dorg.sqlite.tmpdir=C:/Users/k1205/.gradle/sqlite-tmp
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin daemon 預設 ~1g 對 Compose + KSP 太小，會頻繁 spill
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Hilt 2.56+ 支援 KSP2；Room 2.7+ 修了 "unexpected jvm signature V" bug。
# 注意：Hilt 2.59+ 需要 AGP 9，現在 AGP 8.13 用 2.57.2 是上限。
ksp.useKSP2=true
