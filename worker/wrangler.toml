name = "coupon-manager"
main = "src/index.ts"
compatibility_date = "2025-01-01"
keep_vars = true # 後台設定的明文 Variables 不因 deploy 被清掉（Secrets 本來就不受影響）

# LINE webhook 每天固定時間發送到期通知（UTC 00:00 = 台灣 08:00）
[triggers]
crons = ["0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "coupon-manager"
database_id = "214883de-64e2-4bbf-b402-3e6a9bc9a4c5"

# 使用 wrangler secret put <KEY> 設定以下敏感值（不要寫死在這）：
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_CHANNEL_SECRET
#   GEMINI_API_KEY
#   OCR_CLIENT_SECRET    # App 端 OCR 共用密鑰（也要設在 App local.properties 的 coupy.ocrToken）

# Gemini OCR 模型優先鏈 OCR_MODELS（LINE 與 App 共用）不寫在這裡，
# 請在 Cloudflare Dashboard → Settings → Variables 設定（逗號分隔，第一個是主力），
# 改模型不用重新部署；上方 keep_vars = true 保證 deploy 不會清掉後台設定。

[observability]
enabled = true
